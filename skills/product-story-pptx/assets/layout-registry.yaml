# =====================================================================
# product-story-pptx · layout registry
# 单位：英寸。矩形写法 [x, y, w, h]，原点左上。
# =====================================================================

canvas:
  width_in: 13.333
  height_in: 7.5

# 文字安全区：任何文字框不得越过。图片可以越过（那就是 bleed）。
safe:
  x: 0.8
  y: 0.6

footer:
  rect: [0.8, 7.0, 11.733, 0.3]
  hide_on: [cover, section, closing]      # 这些页不显示页脚

# ---------------------------------------------------------------------
# bleed 模式
#   image  图片矩形；null 表示无图
#   text   文字总区域（标题 + 正文都在里面）
#   block  纯色块矩形（仅 color-block）
#   panel  半透明文字面板（仅 overlay）
#   scrim_default  未指定 scrim 时的默认值
#   on_image       文字压在图片上 → 必须有 scrim，并按 scrim 决定文字颜色
# ---------------------------------------------------------------------
bleed_modes:
  none:
    image: null
    text: [0.8, 0.7, 11.733, 6.1]
    on_image: false

  full:
    image: [0, 0, 13.333, 7.5]
    text: [0.9, 3.7, 8.6, 3.0]           # 左下，给图片主体留上半部
    scrim_default: gradient
    on_image: true

  overlay:
    image: [0, 0, 13.333, 7.5]
    panel: [0.9, 1.3, 6.6, 4.9]
    text: [1.3, 1.7, 5.8, 4.1]
    scrim_default: dark
    on_image: true

  partial-left:
    image: [0, 0, 5.6, 7.5]              # 出血：左、上、下
    text: [6.4, 0.9, 6.1, 5.7]
    on_image: false

  partial-right:
    image: [7.733, 0, 5.6, 7.5]          # 出血：右、上、下
    text: [0.8, 0.9, 6.1, 5.7]
    on_image: false

  half:
    image: [6.667, 0, 6.666, 7.5]        # 正好一半
    text: [0.8, 0.9, 5.2, 5.7]
    on_image: false

  half-top:
    image: [0, 0, 13.333, 3.55]          # 上半屏出血；文字位于下半屏
    text: [0.8, 4.05, 11.733, 2.55]
    on_image: false

  half-bottom:
    image: [0, 3.95, 13.333, 3.55]       # 下半屏出血；文字位于上半屏
    text: [0.8, 0.45, 11.733, 3.10]
    on_image: false

  edge:
    image: [7.2, 1.0, 6.133, 6.5]        # 从右下角溢出：出血右、下；上方留 1.0 空气
    text: [0.8, 0.9, 5.6, 5.7]
    on_image: false

  color-block:
    image: null
    block: [0, 0, 13.333, 7.5]
    text: [0.9, 1.3, 11.5, 5.0]
    on_image: false

# ---------------------------------------------------------------------
# 图片裁切锚点（cover 裁切时保留哪一侧）
# ---------------------------------------------------------------------
image_focus:
  center: [0.5, 0.5]
  top:    [0.5, 0.0]
  bottom: [0.5, 1.0]
  left:   [0.0, 0.5]
  right:  [1.0, 0.5]

# ---------------------------------------------------------------------
# 页面类型
#   bleeds      允许的 bleed 模式（lint L02）
#   title_size  design-tokens.typography.sizes 中的键
#   anchor      文字区域内的垂直对齐 top | middle | bottom
#   title_h     标题占用高度（有内容区的类型），其余给 content
#   elements    build 会渲染的字段，按顺序
# ---------------------------------------------------------------------
types:
  cover:
    bleeds: [full, overlay, color-block, half, half-top, edge]
    title_size: cover_title
    anchor: bottom
    elements: [label, title, body]

  section:
    bleeds: [color-block, full, partial-left, half-top, half-bottom, none]
    title_size: section_title
    anchor: middle
    elements: [label, title]

  statement:
    bleeds: [none, color-block, full]
    title_size: statement
    anchor: middle
    elements: [label, title, body]
    text_override:                        # statement 用更窄的列，避免一行拉太长
      none: [1.6, 1.2, 10.1, 5.1]

  quote:
    bleeds: [none, partial-left, partial-right, half-top, half-bottom]
    title_size: subtitle                  # title 在 quote 页只是小结论，quote 正文用 statement 号
    anchor: middle
    elements: [quote, attribution, title]

  feature_hero:
    bleeds: [half, half-top, half-bottom, partial-left, partial-right, edge, full]
    title_size: title
    anchor: middle
    elements: [label, title, body, bullets]

  split:
    bleeds: [half, half-top, half-bottom, partial-left, partial-right, none]
    title_size: title
    anchor: top
    elements: [label, title, body, bullets]

  bullets:
    bleeds: [none, edge]
    title_size: title
    anchor: top
    elements: [label, title, bullets]

  compare:
    bleeds: [none]
    title_size: title
    anchor: top
    title_h: 1.3
    elements: [label, title, compare]

  flow:
    bleeds: [none, color-block]
    title_size: title
    anchor: top
    title_h: 1.3
    elements: [label, title, flow]

  chart:
    bleeds: [none]
    title_size: title
    anchor: top
    title_h: 1.3
    elements: [label, title, chart]

  big_number:
    bleeds: [none, color-block, partial-right]
    title_size: subtitle
    anchor: middle
    elements: [label, number, title, caption, source]

  gallery:
    bleeds: [none]
    title_size: title
    anchor: top
    title_h: 1.3
    elements: [label, title, gallery]
    gap: 0.25

  media_bars:
    bleeds: [none]
    title_size: title
    anchor: top
    title_h: 1.3
    elements: [label, title, media_bars]

  closing:
    bleeds: [full, overlay, color-block]
    title_size: cover_title
    anchor: bottom
    elements: [title, body]

# ---------------------------------------------------------------------
# 流程图几何（flow_diagram.py）
# ---------------------------------------------------------------------
flow:
  cards:
    gap: 0.30            # 节点与箭头之间
    arrow_w: 0.32
    node_h_max: 2.4
    badge_d: 0.42
    corner: 0.12
  chevron:
    node_h: 1.1
    overlap: 0.18
  vertical:
    line_x_offset: 0.3
    row_h_max: 1.15
    badge_d: 0.42
  layers:
    band_gap: 0.14
    band_h_max: 1.0

# ---------------------------------------------------------------------
# 文本上限（lint L01 / L09；build 超限时缩字并 WARN）
# ---------------------------------------------------------------------
text_limits:
  title_cjk: 24
  title_words: 14
  body_cjk: 60
  body_words: 40
  bullets_max: 4
  bullet_cjk: 20
  bullet_words: 12
  overlay_cjk: 24          # full / overlay 页 title + body 合计
  overlay_words: 12
  flow_label_cjk: 6
  flow_label_words: 3
  flow_steps_min: 3
  flow_steps_max: 7
  visual_units_max: 5

# ---------------------------------------------------------------------
# 曲线与预算（lint L03 / L04 / L06）
# ---------------------------------------------------------------------
rhythm:
  opening_min_energy: 3
  first_dip_within: 0.30       # 前 30% 页面内必须出现 energy ≤ 2
  dip_max_energy: 2
  peak_energy: 5
  peak_in_last_n: 2
  max_same_streak: 2           # 不允许连续 3 页相同 energy
  min_range: 2
  bleed_budget: 0.40           # (full + color-block) / 总页数
  max_full_streak: 2
  min_bleed_variety: 3         # 至少 3 种模式，且必须含 none
  max_chart_streak: 2
  breath_types: [statement, section, quote, feature_hero]
